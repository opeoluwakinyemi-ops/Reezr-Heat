<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6f8f">
<meta name="description" content="Free heat safety guide for Nigeria: how hot it feels, what to wear, what to do, and a climate word list.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reezr Heat">
<title>Reezr Heat – Stay safe in the heat</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f6;--card:#fff;--ink:#12202b;--mut:#51606c;--line:#d3dee4;--acc:#0a6f8f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a21;--card:#18262f;--ink:#e8f0f4;--mut:#9db0bb;--line:#2b3d48;--acc:#4cc3e6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a21;--card:#18262f;--ink:#e8f0f4;--mut:#9db0bb;--line:#2b3d48;--acc:#4cc3e6;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.big{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
header h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
header small{color:var(--mut);display:block;font-size:13px;font-weight:400;font-family:"Instrument Sans",system-ui,sans-serif;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--mut);padding:7px 13px;font:600 14px "Instrument Sans",system-ui,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav{display:flex;gap:6px;margin:6px 0 14px}
nav button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 4px;border-radius:12px;font:600 15px "Instrument Sans",system-ui,sans-serif;cursor:pointer}
nav button[aria-selected="true"]{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.band{border-radius:20px;padding:22px 20px;color:#fff;transition:background .35s}
.band .big{font-size:76px;font-weight:800;line-height:1;letter-spacing:-2px}
.band .big span{font-size:30px;font-weight:600;letter-spacing:0}
.band h2{font-size:24px;margin-top:8px;font-weight:800}
.band p{margin:4px 0 0;opacity:.95}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.panel h3{font-size:17px;margin-bottom:8px}
label{display:flex;justify-content:space-between;font-weight:600;margin-top:10px}
input[type=range]{width:100%;accent-color:var(--acc);height:32px}
input[type=text]{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px "Instrument Sans",system-ui,sans-serif}
ul{margin:0;padding-left:20px}li{margin:5px 0}
.do h3{color:#23784a}.avoid h3{color:#b42318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .do h3{color:#5fd391}:root:not([data-theme="light"]) .avoid h3{color:#ff8a80}}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px;font:600 16px "Instrument Sans",system-ui,sans-serif;cursor:pointer;margin-top:10px}
.btn.p{background:#1a8f4c;color:#fff}.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.note{color:var(--mut);font-size:14px;margin-top:8px}
.alert{border-left:5px solid #b42318;background:var(--card);border-radius:12px;padding:14px;margin-top:12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.term{border-bottom:1px solid var(--line);padding:12px 0}.term:last-child{border:0}
.term b{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;font-size:17px;display:block}
footer{color:var(--mut);font-size:13px;margin-top:22px;text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.band{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Reezr Heat<small id="sub"></small></h1>
<div class="seg" role="group" aria-label="Language"><button id="l-en" aria-pressed="true">English</button><button id="l-pcm" aria-pressed="false">Pidgin</button></div>
</header>
<nav role="tablist"><button role="tab" id="t-today"></button><button role="tab" id="t-safe"></button><button role="tab" id="t-words"></button></nav>

<section id="v-today">
<div class="band" id="band" aria-live="polite"><div class="big"><b id="hi">--</b><span>°C</span></div><h2 id="lvl"></h2><p id="lvlsub"></p></div>
<div class="panel">
<h3 id="hq"></h3>
<label><span id="tl"></span><span id="tv"></span></label>
<input type="range" id="t" min="20" max="50" step="1" value="34" aria-labelledby="tl">
<label><span id="hl"></span><span id="hv"></span></label>
<input type="range" id="h" min="10" max="100" step="1" value="60" aria-labelledby="hl">
<button class="btn s" id="loc"></button>
<div class="note" id="locmsg"></div>
</div>
<div class="panel"><h3 id="wh"></h3><div id="wear"></div></div>
<div class="panel do"><h3 id="dh"></h3><ul id="do"></ul></div>
<div class="panel avoid"><h3 id="ah"></h3><ul id="avoid"></ul></div>
<div class="alert" id="em" hidden></div>
<a class="btn p" id="share" target="_blank" rel="noopener"></a>
<button class="btn s" id="pic"></button>
</section>

<section id="v-safe" hidden></section>

<section id="v-words" hidden>
<input type="text" id="q" autocomplete="off">
<div class="panel" id="terms"></div>
</section>

<footer id="foot"></footer>
</div>
<script>
const LV=[
{max:27,c:"#23784a",n:{en:"Comfortable",pcm:"E dey okay"},s:{en:"Normal precautions are enough.",pcm:"Normal care go do."},
 w:{en:"Light cotton clothes are fine.",pcm:"Light cotton cloth dey fine."},
 d:{en:["Drink water through the day.","Check again when it gets hotter."],pcm:["Drink water all day.","Check am again when sun start to hot."]},
 a:{en:["Nothing special. Stay aware."],pcm:["Nothing special. Just dey alert."]}},
{max:32,c:"#8a6100",n:{en:"Warm",pcm:"Weather don warm"},s:{en:"Be mindful, especially outdoors.",pcm:"Take care, especially if you dey outside."},
 w:{en:"Loose, light-coloured cotton. Avoid tight or dark synthetic clothes.",pcm:"Loose, light-colour cotton cloth. No wear tight or dark nylon-type cloth."},
 d:{en:["Carry water and sip often.","Take breaks in the shade.","Check again around midday."],pcm:["Carry water, sip am often.","Rest for shade small-small.","Check weather again for afternoon."]},
 a:{en:["Long hard work in direct sun.","Tight, dark clothes."],pcm:["Long hard work under sun.","Tight, dark cloth."]}},
{max:39.5,c:"#c2410c",n:{en:"Hot",pcm:"Heat dey hot"},s:{en:"Heat can make people sick. Take it seriously.",pcm:"This heat fit make person sick. Take am serious."},
 w:{en:"Loose, light-coloured cotton. Wear a cap, hat or head wrap outdoors.",pcm:"Loose, light-colour cotton. Wear cap, hat or scarf if you dey outside."},
 d:{en:["Drink a cup of water every 20–30 minutes, even if you aren’t thirsty.","Do hard work early morning or evening.","Rest in shade or an airy room.","Wet a cloth and cool your neck, face and wrists.","Check on elders, babies and sick neighbours."],
 pcm:["Drink water every 20–30 minutes, even if thirst no dey.","Do hard work for early morning or evening.","Rest for shade or where air dey flow.","Wet cloth, put am for neck, face and wrist.","Check elders, babies and sick neighbours."]},
 a:{en:["Outdoor work from 11am to 4pm.","Alcohol and lots of sugary drinks.","Leaving anyone in a parked car or a shut room."],pcm:["Work under sun from 11am to 4pm.","Alcohol and plenty sweet drink.","Leaving anybody inside parked car or locked room."]}},
{max:51,c:"#a61b29",n:{en:"Dangerous",pcm:"Heat dey dangerous"},s:{en:"Heat illness is likely if you stay out or work hard.",pcm:"Person fit fall sick if you stay outside or work hard."},
 w:{en:"Very light, loose cotton, plus a head cover. Wet your clothes or head cloth if you can.",pcm:"Very light, loose cotton and head cover. Wet your cloth or head tie if you fit."},
 d:{en:["Stay in the coolest place you have. Go out only if you must, early or late.","Drink water often. If you sweat a lot, use ORS too.","Cool the body: wet cloth, fan, shower or bucket bath.","Check on elders, babies and sick people every few hours.","Learn the heat stroke signs (see Stay safe)."],
 pcm:["Stay where e dey coolest. Go out only if e must, early or late.","Drink water often. If sweat dey pour well-well, take ORS too.","Cool your body: wet cloth, fan, bath or bucket bath.","Check elders, babies and sick people every few hours.","Learn heat stroke signs (see Stay safe)."]},
 a:{en:["Hard work or sports in the sun.","Crowded hot rooms with no airflow.","Waiting until you feel thirsty."],pcm:["Hard work or sports under sun.","Crowded hot room wey no get air.","Waiting till thirst catch you."]}},
{max:999,c:"#6b0f1f",n:{en:"Extreme danger",pcm:"Extreme danger"},s:{en:"Treat this as an emergency. Stay inside and keep cool.",pcm:"This one na emergency. Stay inside, keep your body cool."},
 w:{en:"Minimum light clothing indoors. Keep clothes and head cloth wet.",pcm:"Light cloth only for inside. Keep cloth and head tie wet."},
 d:{en:["Do not go out. Stay in the coolest, shadiest room.","Keep cooling the body all day: wet cloth, fan, bath.","Drink water and ORS often.","Check on everyone at risk every hour.","Anyone confused, fainting or very hot: call 112 or go to hospital now."],
 pcm:["No go out. Stay for coolest, shadiest room.","Dey cool your body all day: wet cloth, fan, bath.","Drink water and ORS often.","Check everybody wey fit suffer every hour.","Anybody wey dey confuse, faint or too hot: call 112 or go hospital now."]},
 a:{en:["Any outdoor work or travel if it can wait.","Closed rooms with no air.","Giving alcohol or only soft drinks."],pcm:["Any outside work or journey wey fit wait.","Closed room wey no get air.","Alcohol or only soft drink."]}}
];
const UI={
en:{sub:"Heat guide for Nigeria",t1:"Today",t2:"Stay safe",t3:"Words",hq:"What is the heat like where you are?",tl:"Temperature",hl:"Humidity",loc:"Use my location",lm:"Or read the temperature and humidity from your phone’s weather app and enter them above.",lmfail:"Live data isn’t available here. Enter the temperature and humidity above.",lmask:"Finding your location…",wh:"What to wear",dh:"Do",ah:"Avoid",feels:"Feels like",em:"<b>Emergency signs:</b> confusion, fainting, fits, very hot skin, or no sweating in the heat. Move the person to shade, cool them with wet cloth and a fan, and call <b>112</b> or go to the nearest hospital now.",share:"Share today’s heat advice on WhatsApp",pic:"Share as a picture",sh:"Heat advice",ph:"Search a word, e.g. El Niño",foot:"Version 1. General guidance, not a replacement for medical care. If someone is very ill, go to a clinic or hospital.",none:"No match found."},
pcm:{sub:"Heat guide for Naija",t1:"Today",t2:"Stay safe",t3:"Words",hq:"How the heat be for where you dey?",tl:"Temperature",hl:"Humidity",loc:"Use my location",lm:"Or check temperature and humidity for your phone weather app, then put am for up.",lmfail:"Live data no dey here. Put the temperature and humidity for up.",lmask:"We dey find where you dey…",wh:"Wetin to wear",dh:"Wetin to do",ah:"Wetin to avoid",feels:"E dey feel like",em:"<b>Emergency signs:</b> person dey confuse, faint, shake body, skin dey too hot, or sweat no dey come for heat. Carry am go shade, cool am with wet cloth and fan, then call <b>112</b> or rush am go hospital now.",share:"Share today heat advice for WhatsApp",pic:"Share as picture",sh:"Heat advice",ph:"Search word, like El Niño",foot:"Version 1. This na general guide, no be doctor. If person sick well-well, go clinic or hospital.",none:"We no see am."}
};
const SAFE=[
{h:{en:"Stay cool without power",pcm:"How to stay cool without light"},b:{en:["Open windows on opposite sides of the room so air can pass through, especially at night.","Hang a wet cloth or wet sack over a sunny window or doorway.","Stay on the lowest, shadiest floor. Sit under a tree if the room is hotter than outside.","Cool your neck, wrists, armpits and face with a wet cloth.","Cook early morning or evening, and outside if you can."],pcm:["Open window for both sides of the room so air go pass, especially for night.","Hang wet cloth or wet sack for window or door wey sun dey enter.","Stay for the lowest, shadiest floor. Sit under tree if room hotter pass outside.","Cool neck, wrist, armpit and face with wet cloth.","Cook for early morning or evening, and outside if you fit."]}},
{h:{en:"Water and ORS",pcm:"Water and ORS"},b:{en:["Sip water through the day. Don’t wait for thirst.","If you sweat a lot, have diarrhoea or vomit, use an ORS sachet. Mix it with exactly the amount of clean water written on the pack.","Drink only clean or treated water. Boil, filter or treat it if you are unsure.","Limit alcohol and very sugary drinks."],pcm:["Sip water all day. No wait for thirst.","If you sweat plenty, run belle or vomit, use ORS sachet. Mix am with the exact quantity of clean water wey dem write for the pack.","Drink only clean or treated water. Boil, filter or treat am if you no sure.","Reduce alcohol and sweet drink."]}},
{h:{en:"Who is at most risk",pcm:"Who dey most at risk"},b:{en:["Babies and young children","Elders and people who live alone","Pregnant women","People with heart, kidney, diabetes or other long-term illness","Outdoor workers: farmers, traders, builders, drivers, bike riders"],pcm:["Babies and small children","Elders and people wey dey live alone","Pregnant women","People wey get heart, kidney, sugar or other long sickness","People wey dey work outside: farmers, traders, builders, drivers, okada riders"]}},
{h:{en:"Heat stroke: act fast",pcm:"Heat stroke: act fast"},b:{en:["Signs: confusion, severe headache, fainting, fits, very hot skin, fast pulse, or no sweating.","Move the person to shade. Remove extra clothes.","Cool with wet cloth, fanning and water on the skin.","Give sips of water only if they are awake and alert.","Call 112 or take them to the nearest hospital now."],pcm:["Signs: confusion, serious headache, faint, fits, skin too hot, fast pulse, or sweat no dey come.","Carry the person go shade. Remove extra cloth.","Cool am with wet cloth, fan and water for skin.","Give small water only if the person dey awake and alert.","Call 112 or carry am go nearest hospital now."]}}
];
const WORDS=[
["El Niño","A natural warming of the central and eastern Pacific Ocean that changes weather around the world. It often pushes global temperatures up and shifts where rain falls, but effects differ from place to place."],
["La Niña","The opposite of El Niño: a cooling of the same part of the Pacific. It tends to bring different rainfall and temperature patterns."],
["Weather vs climate","Weather is what is happening today or this week. Climate is the average pattern over many years, usually 30 or more."],
["Climate change","A long-term shift in average temperatures and weather patterns. Today it is mostly driven by burning fossil fuels, which adds greenhouse gases to the air."],
["Climate extreme","A very rare or severe weather event, such as intense heat, flooding or drought."],
["Heat wave","A period of unusually hot weather that lasts several days and can make people sick."],
["Heat index","How hot it feels to your body when heat and humidity are combined. Humid air makes sweat evaporate slowly, so the same temperature feels hotter."],
["Heat exhaustion","Illness from too much heat: heavy sweating, weakness, headache, nausea. Rest in shade, cool the body and drink fluids. It can become heat stroke."],
["Heat stroke","A medical emergency. The body can’t cool itself. Signs include confusion, fainting, fits and very hot skin. Call 112 or get to a hospital."],
["Dehydration","When the body loses more water than it takes in. Signs include thirst, dark urine, dizziness and tiredness."],
["ORS","Oral rehydration salts: a sachet mixed with clean water that replaces water and salts lost through sweat, vomiting or diarrhoea."],
["Drought","A long period with much less rain than normal, causing water and food shortages."],
["Harmattan","A dry, dusty wind from the Sahara that blows over West Africa, mostly from November to March. It brings dry air, haze and cooler nights."],
["Early warning","A message that tells people a hazard is coming in time to prepare, such as a heat or flood alert."]
];
let S={t:34,h:60,l:"en",tab:"today"};
const $=id=>document.getElementById(id);
function hiC(tc,rh){const T=tc*9/5+32;let hi=0.5*(T+61+(T-68)*1.2+rh*0.094);
 if((hi+T)/2>=80){hi=-42.379+2.04901523*T+10.14333127*rh-0.22475541*T*rh-0.00683783*T*T-0.05481717*rh*rh+0.00122874*T*T*rh+0.00085282*T*rh*rh-0.00000199*T*T*rh*rh;
 if(rh<13&&T>=80&&T<=112)hi-=((13-rh)/4)*Math.sqrt((17-Math.abs(T-95))/17);
 if(rh>85&&T>=80&&T<=87)hi+=((rh-85)/10)*((87-T)/5);}
 return Math.max((hi-32)*5/9,tc);}
function lvl(v){return LV.find(x=>v<x.max)}
function lst(a){return a.map(x=>"<li>"+x+"</li>").join("")}
function render(){
 const L=S.l,u=UI[L];
 document.documentElement.lang=L==="en"?"en":"pcm";
 $("sub").textContent=u.sub;$("t-today").textContent=u.t1;$("t-safe").textContent=u.t2;$("t-words").textContent=u.t3;
 $("l-en").setAttribute("aria-pressed",L==="en");$("l-pcm").setAttribute("aria-pressed",L==="pcm");
 ["today","safe","words"].forEach(k=>{$("v-"+k).hidden=S.tab!==k;$("t-"+k).setAttribute("aria-selected",S.tab===k)});
 $("hq").textContent=u.hq;$("tl").textContent=u.tl;$("hl").textContent=u.hl;$("loc").textContent=u.loc;
 $("tv").textContent=S.t+"°C";$("hv").textContent=S.h+"%";
 if(!$("locmsg").dataset.k)$("locmsg").textContent=u.lm;else $("locmsg").textContent=u[$("locmsg").dataset.k];
 const hi=hiC(S.t,S.h),lv=lvl(hi);
 $("band").style.background=lv.c;$("hi").textContent=Math.round(hi);
 $("lvl").textContent=u.feels+" · "+lv.n[L];$("lvlsub").textContent=lv.s[L];
 $("wh").textContent=u.wh;$("wear").textContent=lv.w[L];
 $("dh").textContent=u.dh;$("do").innerHTML=lst(lv.d[L]);
 $("ah").textContent=u.ah;$("avoid").innerHTML=lst(lv.a[L]);
 const hot=hi>=32;$("em").hidden=!hot;$("em").innerHTML=u.em;
 $("share").textContent=u.share;$("pic").textContent=u.pic;
 const msg="Reezr Heat: "+Math.round(hi)+"°C feels-like ("+lv.n.en+"). "+lv.s.en+" Drink water often, avoid the sun from 11am to 4pm, check on elders and children. Emergency: 112.";
 $("share").href="https://wa.me/?text="+encodeURIComponent(msg);
 $("v-safe").innerHTML=SAFE.map(s=>"<div class='panel'><h3>"+s.h[L]+"</h3><ul>"+lst(s.b[L])+"</ul></div>").join("");
 $("q").placeholder=u.ph;drawWords();$("foot").textContent=u.foot;
}
function drawWords(){const q=$("q").value.trim().toLowerCase();
 const r=WORDS.filter(w=>!q||w[0].toLowerCase().includes(q)||w[1].toLowerCase().includes(q));
 $("terms").innerHTML=r.length?r.map(w=>"<div class='term'><b>"+w[0]+"</b>"+w[1]+"</div>").join(""):UI[S.l].none;}
$("t").oninput=e=>{S.t=+e.target.value;render()};
$("h").oninput=e=>{S.h=+e.target.value;render()};
$("l-en").onclick=()=>{S.l="en";render()};$("l-pcm").onclick=()=>{S.l="pcm";render()};
["today","safe","words"].forEach(k=>$("t-"+k).onclick=()=>{S.tab=k;render()});
$("q").oninput=drawWords;
function wrap(g,t,x,y,w,lh){const ws=t.split(" ");let l="";for(const k of ws){const n=l?l+" "+k:k;if(g.measureText(n).width>w&&l){g.fillText(l,x,y);y+=lh;l=k}else l=n}g.fillText(l,x,y);return y+lh}
$("pic").onclick=async()=>{
 const L=S.l,u=UI[L],hi=hiC(S.t,S.h),lv=lvl(hi),W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
 const hf='"Bricolage Grotesque","Trebuchet MS",sans-serif',bf='"Instrument Sans",system-ui,sans-serif';
 try{await Promise.all([document.fonts.load('800 60px "Bricolage Grotesque"'),document.fonts.load('500 30px "Instrument Sans"')])}catch(e){}
 g.fillStyle="#fff";g.fillRect(0,0,W,H);g.fillStyle=lv.c;g.fillRect(0,0,W,600);
 g.fillStyle="#fff";g.textBaseline="alphabetic";
 g.font="600 38px "+bf;g.fillText("Reezr Heat · "+new Date().toLocaleDateString("en-NG",{weekday:"long",day:"numeric",month:"long"}),60,86);
 const n=String(Math.round(hi));g.font="800 250px "+hf;g.fillText(n,60,340);
 const nw=g.measureText(n).width;g.font="600 80px "+hf;g.fillText("°C",60+nw+12,340);
 g.font="800 62px "+hf;g.fillText(u.feels+" · "+lv.n[L],60,430);
 g.font="500 38px "+bf;wrap(g,lv.s[L],60,490,960,48);
 g.fillStyle="#12202b";g.font="800 54px "+hf;g.fillText(u.dh,60,690);
 g.font="500 38px "+bf;let y=755;
 for(const t of lv.d[L].slice(0,3)){g.fillText("•",60,y);y=wrap(g,t,105,y,915,50)+14}
 g.fillStyle=lv.c;g.fillRect(60,1235,960,4);
 g.fillStyle="#51606c";g.font="600 36px "+bf;g.fillText(L==="en"?"Emergency: call 112. Share with your family.":"Emergency: call 112. Share am with your people.",60,1295);
 const b=await new Promise(r=>c.toBlob(r,"image/png"));
 const f=new File([b],"reezr-heat-"+new Date().toISOString().slice(0,10)+".png",{type:"image/png"});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
};
function fail(){$("locmsg").dataset.k="lmfail";render()}
$("loc").onclick=()=>{
 if(!navigator.geolocation)return fail();
 $("locmsg").dataset.k="lmask";render();
 navigator.geolocation.getCurrentPosition(async p=>{
  try{const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+p.coords.latitude+"&longitude="+p.coords.longitude+"&current=temperature_2m,relative_humidity_2m");
   const j=await r.json();S.t=Math.min(50,Math.max(20,Math.round(j.current.temperature_2m)));S.h=Math.min(100,Math.max(10,Math.round(j.current.relative_humidity_2m)));
   $("t").value=S.t;$("h").value=S.h;delete $("locmsg").dataset.k;render();}catch(e){fail()}
 },fail,{timeout:10000});};
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
